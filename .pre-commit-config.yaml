repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ["check", "--fix"]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, ci, chore, req]

  - repo: local
    hooks:
      - id: check-req-commit
        name: Check requirement file commit type
        entry: python .pre-commit-hooks/check_req_commit.py
        language: python
        stages: [commit-msg]
        always_run: true
