[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferdi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.4",
    "sounddevice>=0.5.1",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pyyaml",
    "pre-commit",
]
