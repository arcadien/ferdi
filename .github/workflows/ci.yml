name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get install -y libportaudio2
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint with ruff
        run: uv run ruff check ferdi/ tests/
      - name: Format check with ruff
        run: uv run ruff format --check ferdi/ tests/
      - name: Validate conventional commits
        if: github.event_name == 'push'
        run: |
          uv run python -c "
          import subprocess, re, sys
          msg = subprocess.check_output(['git', 'log', '-1', '--format=%B']).decode().strip().splitlines()[0]
          if msg.startswith('Merge '):
              print(f'OK (merge commit, skipping): {msg!r}')
              sys.exit(0)
          pattern = r'^(feat|fix|docs|style|refactor|test|ci|chore|req)(\([^)]+\))?!?: .+'
          if not re.match(pattern, msg):
              print(f'ERROR: commit message does not follow Conventional Commits:\n  {msg!r}')
              sys.exit(1)
          print(f'OK: {msg!r}')
          "
      - name: Run tests
        run: uv run pytest tests/ -v
